<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#003465" />
    <meta
      name="description"
      content="Hayat Pharmacy Management System - inventory, sales and supply management."
    />
    <link rel="apple-touch-icon" href="/logo192.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="/manifest.json" />
    <title>Hayat Pharmacy</title>

    <!--
      Apply the saved theme before first paint. Without this the `dark` class was only
      added once React mounted, so dark-mode users saw a white flash on every load.
      Kept inline and tiny so it never blocks meaningfully.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("darkMode");
          var pharmacist = localStorage.getItem("pharmacistThemeMode");
          var isDark =
            stored !== null
              ? stored === "true"
              : pharmacist !== null
              ? pharmacist === "dark"
              : window.matchMedia("(prefers-color-scheme: dark)").matches;
          if (isDark) document.documentElement.classList.add("dark");
        } catch (e) {
          /* localStorage unavailable - fall back to the light theme */
        }
      })();
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
